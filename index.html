<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот и Мышка</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f2027; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const stage = document.createElement('div');
        stage.style = 'width:100vw; height:100vh; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); position:fixed; left:0; top:0; overflow:hidden; font-family: "Segoe UI", sans-serif; user-select:none; touch-action:none;';
        document.body.appendChild(stage);

        const grid = document.createElement('div');
        grid.style = 'position:absolute; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.5;';
        stage.appendChild(grid);

        const cat = document.createElement('div');
        cat.innerHTML = '🐱'; cat.style = 'font-size:55px; position:absolute; left:40px; top:40%; display:none; will-change: transform; pointer-events:none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); z-index: 5;';
        stage.appendChild(cat);

        const mouse = document.createElement('div');
        mouse.innerHTML = '🐭'; mouse.style = 'font-size:40px; position:absolute; left:70%; top:40%; display:none; will-change: transform; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); z-index: 4;';
        stage.appendChild(mouse);

        let mouseX, mouseY, catX, catY;
        let mouseSpeed = 5; 
        let gameActive = false;
        let gameLoop;

        const menu = document.createElement('div');
        menu.style = 'position:absolute; width:100%; height:100%; background:rgba(15, 32, 39, 0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10; text-align:center; padding: 20px; box-sizing: border-box;';
        menu.innerHTML = `
          <h1 style="margin:0 0 5px 0; font-size:36px; letter-spacing: 2px; text-shadow: 0 0 10px #00d2ff;">КОТ И МЫШКА</h1>
          <p style="margin:0 0 30px 0; color:#00d2ff; font-size:14px; font-weight: bold;">Води пальцем по экрану и поймай мышь!</p>
          <p style="margin:0 0 15px 0; color:#fff; font-size:16px;">ВЫБЕРИ СЛОЖНОСТЬ:</p>
        `;
        stage.appendChild(menu);

        const btnContainer = document.createElement('div');
        btnContainer.style = 'display:flex; flex-direction:column; gap:15px; width: 80%; max-width: 300px;';
        menu.appendChild(btnContainer);

        function createMenuBtn(text, color, shadow, speed) {
          const btn = document.createElement('button');
          btn.innerText = text;
          btn.style = `padding:15px; font-size:16px; font-weight:bold; background:${color}; color:white; border:none; border-radius:12px; cursor:pointer; transition: 0.2s; box-shadow: 0 4px 15px ${shadow}; text-transform: uppercase; letter-spacing: 1px;`;
          btn.onclick = () => { mouseSpeed = speed; startGame(); };
          btnContainer.appendChild(btn);
        }

        createMenuBtn('👶 Легко', '#4caf50', 'rgba(76,175,80,0.4)', 4);
        createMenuBtn('⚡️ Нормально', '#ff9800', 'rgba(255,152,0,0.4)', 8);
        createMenuBtn('🏆 КИБЕРСПОРТ', '#f44336', 'rgba(244,67,54,0.4)', 18);

        const winScreen = document.createElement('div');
        winScreen.style = 'position:absolute; width:100%; height:100%; background:rgba(20, 40, 50, 0.95); display:none; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10; text-align:center;';
        winScreen.innerHTML = `
          <h1 style="margin:0 0 10px 0; font-size:40px; color:#4caf50; text-shadow: 0 0 15px rgba(76,175,80,0.6);">🎉 ПОБЕДА! 🎉</h1>
          <p style="margin:0 0 30px 0; font-size:18px; color: #eceff1;">Шустрая мышка поймана!</p>
        `;
        stage.appendChild(winScreen);

        const restartBtn = document.createElement('button');
        restartBtn.innerText = 'В ГЛАВНОЕ МЕНЮ 🏠';
        restartBtn.style = 'padding:15px 30px; font-size:16px; background:#00d2ff; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(0,210,255,0.4);';
        restartBtn.onclick = () => { winScreen.style.display = 'none'; menu.style.display = 'flex'; };
        winScreen.appendChild(restartBtn);

        function startGame() {
          menu.style.display = 'none';
          winScreen.style.display = 'none';
          catX = 50; catY = window.innerHeight * 0.4;
          mouseX = window.innerWidth - 100; mouseY = window.innerHeight * 0.4;
          cat.style.left = catX + 'px'; cat.style.top = catY + 'px';
          cat.style.display = 'block'; mouse.style.display = 'block';
          gameActive = true;
          runGameLoop();
        }

        function moveCat(e) {
          if (!gameActive) return;
          let clientX, clientY;
          if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX; clientY = e.clientY;
          }
          catX = clientX - 28; catY = clientY - 28; 
          cat.style.left = catX + 'px'; cat.style.top = catY + 'px';
        }

        stage.addEventListener('touchstart', moveCat);
        stage.addEventListener('touchmove', moveCat);
        stage.addEventListener('mousemove', moveCat); 

        function runGameLoop() {
          if(gameLoop) clearInterval(gameLoop);
          gameLoop = setInterval(() => {
            if (!gameActive) return;
            let diffX = mouseX - catX; let diffY = mouseY - catY;
            let distance = Math.sqrt(diffX * diffX + diffY * diffY);
            if (distance < 250) { 
              mouseX += (diffX / distance) * mouseSpeed;
              mouseY += (diffY / distance) * mouseSpeed;
            }
            if (mouseX < 15) mouseX = 15;
            if (mouseX > window.innerWidth - 55) mouseX = window.innerWidth - 55;
            if (mouseY < 15) mouseY = 15;
            if (mouseY > window.innerHeight - 55) mouseY = window.innerHeight - 55;
            mouse.style.left = mouseX + 'px'; mouse.style.top = mouseY + 'px';
            if (distance < 45) {
              gameActive = false; clearInterval(gameLoop);
              cat.style.display = 'none'; mouse.style.display = 'none';
              winScreen.style.display = 'flex';
            }
          }, 20);
        }
    </script>
</body>
</html>
