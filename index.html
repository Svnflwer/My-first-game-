<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот и Мышка — Моя Игра</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f2027;
            overflow: hidden;
        }
        /* Стили для порталов */
        .portal {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff, #0000ff);
            box-shadow: 0 0 15px #00ffff;
            animation: rotatePortal 2s linear infinite;
            display: none;
            z-index: 2;
        }
        @keyframes rotatePortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <script>
        // 1. Создаем красивое неоновое игровое поле под экран смартфона
        const stage = document.createElement('div');
        stage.style = 'width:100vw; height:100vh; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); position:fixed; left:0; top:0; overflow:hidden; font-family: "Segoe UI", sans-serif; user-select:none; touch-action:none;';
        document.body.appendChild(stage);

        // Сетка на заднем фоне
        const grid = document.createElement('div');
        grid.style = 'position:absolute; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.5;';
        stage.appendChild(grid);

        // Персонажи
        const cat = document.createElement('div');
        cat.innerHTML = '🐱'; cat.style = 'font-size:55px; position:absolute; left:40px; top:40%; display:none; will-change: transform; pointer-events:none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); z-index: 5; transition: opacity 0.3s;';
        stage.appendChild(cat);

        const mouse = document.createElement('div');
        mouse.innerHTML = '🐭'; mouse.style = 'font-size:40px; position:absolute; left:70%; top:40%; display:none; will-change: transform; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); z-index: 4; transition: opacity 0.2s;';
        stage.appendChild(mouse);

        // Создаем порталы для нового режима
        const portal1 = document.createElement('div'); portal1.className = 'portal'; stage.appendChild(portal1);
        const portal2 = document.createElement('div'); portal2.className = 'portal'; stage.appendChild(portal2);

        // Параметры игры
        let mouseX, mouseY, catX, catY;
        let mouseSpeed = 5; 
        let gameMode = 'normal'; // Режимы: normal, ghost, portals
        let gameActive = false;
        let gameLoop;

        // 2. ГЕЙМЕРСКОЕ СТАРТОВОЕ МЕНЮ
        const menu = document.createElement('div');
        menu.style = 'position:absolute; width:100%; height:100%; background:rgba(15, 32, 39, 0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10; text-align:center; padding: 20px; box-sizing: border-box; overflow-y: auto;';
        menu.innerHTML = `
          <h1 style="margin:0 0 5px 0; font-size:32px; letter-spacing: 2px; text-shadow: 0 0 10px #00d2ff;">КОТ И МЫШКА 2.0</h1>
          <p style="margin:0 0 20px 0; color:#00d2ff; font-size:14px; font-weight: bold;">Поймай мышь на новых безумных уровнях!</p>
          <p style="margin:0 0 10px 0; color:#fff; font-size:16px;">ВЫБЕРИ РЕЖИМ ИГРЫ:</p>
        `;
        stage.appendChild(menu);

        const btnContainer = document.createElement('div');
        btnContainer.style = 'display:flex; flex-direction:column; gap:10px; width: 85%; max-width: 300px;';
        menu.appendChild(btnContainer);

        function createMenuBtn(text, color, shadow, speed, mode) {
          const btn = document.createElement('button');
          btn.innerText = text;
          btn.style = `padding:12px; font-size:14px; font-weight:bold; background:${color}; color:white; border:none; border-radius:12px; cursor:pointer; transition: 0.2s; box-shadow: 0 4px 15px ${shadow}; text-transform: uppercase; letter-spacing: 1px;`;
          btn.onclick = () => { mouseSpeed = speed; gameMode = mode; startGame(); };
          btnContainer.appendChild(btn);
        }

        // Кнопки меню с новыми уровнями
        createMenuBtn('👶 Легко', '#4caf50', 'rgba(76,175,80,0.4)', 4, 'normal');
        createMenuBtn('⚡️ Киберспорт', '#ff9800', 'rgba(255,152,0,0.4)', 14, 'normal');
        createMenuBtn('👻 Невидимка', '#9c27b0', 'rgba(156,39,176,0.4)', 7, 'ghost');
        createMenuBtn('🌀 Порталы', '#00bcd4', 'rgba(0,188,212,0.4)', 8, 'portals');

        // 3. ЭКРАН ПОБЕДЫ
        const winScreen = document.createElement('div');
        winScreen.style = 'position:absolute; width:100%; height:100%; background:rgba(20, 40, 50, 0.95); display:none; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10; text-align:center;';
        winScreen.innerHTML = `
          <h1 style="margin:0 0 10px 0; font-size:40px; color:#4caf50; text-shadow: 0 0 15px rgba(76,175,80,0.6);">🎉 ПОБЕДА! 🎉</h1>
          <p style="margin:0 0 30px 0; font-size:18px; color: #eceff1;">Ты лучшая! Мышка поймана!</p>
        `;
        stage.appendChild(winScreen);

        const restartBtn = document.createElement('button');
        restartBtn.innerText = 'В ГЛАВНОЕ МЕНЮ 🏠';
        restartBtn.style = 'padding:15px 30px; font-size:16px; background:#00d2ff; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(0,210,255,0.4);';
        restartBtn.onclick = () => { winScreen.style.display = 'none'; menu.style.display = 'flex'; };
        winScreen.appendChild(restartBtn);

        // 4. Логика старта
        function startGame() {
          menu.style.display = 'none';
          winScreen.style.display = 'none';
          
          catX = 50; catY = window.innerHeight * 0.4;
          mouseX = window.innerWidth - 100; mouseY = window.innerHeight * 0.4;
          
          cat.style.left = catX + 'px'; cat.style.top = catY + 'px';
          cat.style.display = 'block';
          mouse.style.display = 'block';
          mouse.style.opacity = '1';
          
          if (gameMode === 'portals') {
              portal1.style.display = 'block';
              portal2.style.display = 'block';
              portal1.style.left = '20px'; portal1.style.top = '20px';
              portal2.style.left = (window.innerWidth - 60) + 'px'; portal2.style.top = (window.innerHeight - 60) + 'px';
          } else {
              portal1.style.display = 'none';
              portal2.style.display = 'none';
          }
          
          gameActive = true;
          runGameLoop();
        }

        // 5. Управление тачем
        function moveCat(e) {
          if (!gameActive) return;
          
          let clientX, clientY;
          if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }
          
          catX = clientX - 28;
          catY = clientY - 28; 
          cat.style.left = catX + 'px';
          cat.style.top = catY + 'px';
        }

        stage.addEventListener('touchstart', moveCat);
        stage.addEventListener('touchmove', moveCat);
        stage.addEventListener('mousemove', moveCat); 

        // 6. Скрипт бега мышки и игровых режимов
        function runGameLoop() {
          if(gameLoop) clearInterval(gameLoop);
          
          gameLoop = setInterval(() => {
            if (!gameActive) return;

            let diffX = mouseX - catX;
            let diffY = mouseY - catY;
            let distance = Math.sqrt(diffX * diffX + diffY * diffY);

            // Убегание мышки
            if (distance < 250) { 
              mouseX += (diffX / distance) * mouseSpeed;
              mouseY += (diffY / distance) * mouseSpeed;
            }

            // Фишка режима НЕВИДИМКА: мышка пропадает, если кот близко
            if (gameMode === 'ghost') {
                if (distance < 130) {
                    mouse.style.opacity = '0.15'; // Становится почти прозрачной
                } else {
                    mouse.style.opacity = '1';
                }
            }

            // Фишка режима ПОРТАЛЫ: телепортация при заходе в портал
            if (gameMode === 'portals') {
                // Дистанция до первого портала
                let d1 = Math.sqrt(Math.pow(mouseX - 20, 2) + Math.pow(mouseY - 20, 2));
                // Дистанция до второго портала
                let d2 = Math.sqrt(Math.pow(mouseX - (window.innerWidth - 60), 2) + Math.pow(mouseY - (window.innerHeight - 60), 2));
                
                if (d1 < 30 || d2 < 30) {
                    // Телепортируем мышку в случайную точку экрана
                    mouseX = Math.random() * (window.innerWidth - 100) + 50;
                    mouseY = Math.random() * (window.innerHeight - 100) + 50;
                }
            }

            // Удерживаем в границах экрана
            if (mouseX < 15) mouseX = 15;
            if (mouseX > window.innerWidth - 55) mouseX = window.innerWidth - 55;
            if (mouseY < 15) mouseY = 15;
            if (mouseY > window.innerHeight - 55) mouseY = window.innerHeight - 55;

            mouse.style.left = mouseX + 'px';
            mouse.style.top = mouseY + 'px';

            // Условие поимки мышки
            if (distance < 45) {
              gameActive = false;
              clearInterval(gameLoop);
              cat.style.display = 'none';
              mouse.style.display = 'none';
              portal1.style.display = 'none';
